name: CI - Code Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required files
        run: test -s index.html && test -s style.css && test -s script.js
      - name: Check JavaScript syntax
        run: node --check model.js && node --check script.js
      - name: Test application behavior
        run: node --test tests/model.test.cjs
      - name: Test SQLite schema when present
        run: |
          if [ -f tests/test_database.py ]; then python3 tests/test_database.py; fi
